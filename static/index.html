<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lofi stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #c8b89a;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }

    #player-wrap {
      position: relative;
      width: 100%;
      max-width: 832px;
    }

    video {
      width: 100%;
      border-radius: 6px;
      display: block;
      background: #111;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 15, 0.85);
      border-radius: 6px;
      flex-direction: column;
      gap: 14px;
      transition: opacity 0.6s;
    }

    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(200, 184, 154, 0.2);
      border-top-color: #c8b89a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      opacity: 0.7;
    }

    #info {
      width: 100%;
      max-width: 832px;
      font-size: 0.78rem;
      opacity: 0.45;
      line-height: 1.6;
    }

    #info span { display: block; }

    #unmute-btn {
      display: none;
      padding: 8px 20px;
      background: none;
      border: 1px solid rgba(200, 184, 154, 0.4);
      color: #c8b89a;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    #unmute-btn:hover { border-color: #c8b89a; }
  </style>
</head>
<body>

  <div id="player-wrap">
    <video id="video" playsinline></video>
    <div id="overlay">
      <div class="spinner"></div>
      <div id="loading-text">generating stream…</div>
    </div>
  </div>

  <div id="info">
    <span id="scene-line"></span>
    <span id="music-line"></span>
  </div>

  <button id="unmute-btn" onclick="unmute()">▶ unmute</button>

  <script>
    const video     = document.getElementById('video');
    const overlay   = document.getElementById('overlay');
    const loadText  = document.getElementById('loading-text');
    const sceneLine = document.getElementById('scene-line');
    const musicLine = document.getElementById('music-line');
    const unmuteBtn = document.getElementById('unmute-btn');

    let hls = null;
    let streaming = false;

    // Watchdog: if the video hasn't advanced for this many ms, force recovery.
    const STALL_TIMEOUT_MS = 8000;
    let stallTimer = null;
    let lastTime = 0;

    function resetStallTimer() {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => {
        if (video.currentTime === lastTime && !video.paused) {
          // Buffer stall — tell HLS.js to resume fetching then nudge the player.
          // startLoad() is the right call here; recoverMediaError() is for codec errors.
          if (hls) hls.startLoad();
          video.play().catch(() => {});
        }
        lastTime = video.currentTime;
      }, STALL_TIMEOUT_MS);
    }

    function startStream() {
      if (streaming) return;
      streaming = true;

      const src = '/hls/stream.m3u8';

      if (Hls.isSupported()) {
        hls = new Hls({
          liveSyncDurationCount: 8,
          liveMaxLatencyDurationCount: 16,
          maxBufferLength: 120,
          enableWorker: true,
          fragLoadingMaxRetry: 8,
          fragLoadingRetryDelay: 2000,
          manifestLoadingMaxRetry: 6,
          manifestLoadingRetryDelay: 2000,
        });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          console.warn('[hls] fatal error', data.type, data.details);
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setTimeout(() => hls.startLoad(), 3000);
          } else {
            hls.destroy();
            streaming = false;
            setTimeout(startStream, 5000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS
        video.src = src;
        video.addEventListener('loadedmetadata', tryPlay);
      }
    }

    function tryPlay() {
      overlay.classList.add('hidden');
      video.play().catch(() => {
        video.muted = true;
        video.play();
        unmuteBtn.style.display = 'inline-block';
      });
    }

    function unmute() {
      video.muted = false;
      unmuteBtn.style.display = 'none';
    }

    // Kick the watchdog whenever the video is healthy.
    video.addEventListener('timeupdate', () => { lastTime = video.currentTime; resetStallTimer(); });
    video.addEventListener('playing',    resetStallTimer);
    // On a stall event, nudge currentTime to unstick the decoder.
    video.addEventListener('stalled',    () => { video.currentTime += 0.1; });

    async function pollStatus() {
      try {
        const res = await fetch('/status');
        const data = await res.json();

        if (data.scene) sceneLine.textContent = '⌗ ' + data.scene;
        if (data.music) musicLine.textContent = '♪ ' + data.music;

        if (data.ready) {
          loadText.textContent = 'buffering…';
          startStream();
          return; // stream is live — stop polling
        }
        loadText.textContent = 'generating stream…';
      } catch (_) {}
      setTimeout(pollStatus, 2000);
    }

    pollStatus();
  </script>
</body>
</html>
